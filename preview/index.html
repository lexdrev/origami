<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ORIGAMI stand</title>
    <style>
      body { margin: 0; background: #0a0c0f; color: #8d98a5; font: 12px ui-monospace, monospace; }
      .frames { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 32px; padding: 24px; }
      .frame { margin: 0; }
      .frame figcaption { margin-bottom: 8px; }
      /* Decky plugin area as measured in the QAM: 300 px wide, Steam panel colour, no side padding. */
      .panel { width: 300px; min-height: 540px; box-sizing: border-box; background: #0e141b; }
      .decky-title { display: flex; align-items: center; height: 40px; padding: 6px 16px 0; }
      .decky-back { display: flex; align-items: center; justify-content: center; width: 40px; height: 28px; flex-shrink: 0; border-radius: 2px; background: #3d4450; color: #fff; font: 16px system-ui; }
      .decky-content { padding-top: 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
